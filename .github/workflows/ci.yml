name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The shared sccache bucket dabba provisions, used for dabba's own builds.
      # INERT UNTIL CONFIGURED: with no SCCACHE_ENDPOINT secret this is a no-op and
      # the job runs exactly as it did before, so merging it cannot break CI.
      #
      # Which credential a build gets is the security boundary, and it is decided
      # here rather than inside the job:
      #   trusted branch  -> read-write, populates the shared cache
      #   same-repo PR    -> read-only, benefits and cannot poison
      #   fork PR         -> nothing at all; GitHub gives forks no secrets, and
      #                      publishing even a read-only key would expose every
      #                      build artifact. Forks compile cold, deliberately.
      - name: use the shared build cache
        if: vars.SCCACHE_ENDPOINT != ''
        env:
          TRUSTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # A fork PR is the only case with no access. Everything else — a branch
          # push, or a pull request whose head is in this repository — comes from
          # someone with commit rights and gets the read-only credential.
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          READ_WRITE_KEY: ${{ secrets.SCCACHE_READWRITE_ACCESS_KEY }}
          READ_WRITE_SECRET: ${{ secrets.SCCACHE_READWRITE_SECRET_KEY }}
          READ_ONLY_KEY: ${{ secrets.SCCACHE_READONLY_ACCESS_KEY }}
          READ_ONLY_SECRET: ${{ secrets.SCCACHE_READONLY_SECRET_KEY }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "fork build: no cache credential, compiling cold (by design —"
            echo "GitHub gives forks no secrets, and publishing one would expose"
            echo "every build artifact)"
            exit 0
          elif [ "$TRUSTED" = "true" ]; then
            scope=read-write; key="$READ_WRITE_KEY"; secret="$READ_WRITE_SECRET"
          else
            scope=read-only;  key="$READ_ONLY_KEY";  secret="$READ_ONLY_SECRET"
            echo "SCCACHE_READONLY=1" >> "$GITHUB_ENV"
          fi
          if [ -z "$key" ]; then
            echo "::warning::no $scope cache credential configured; compiling cold"
            exit 0
          fi
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/sccache'
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BUCKET=sccache"
            echo "SCCACHE_ENDPOINT=${{ vars.SCCACHE_ENDPOINT }}"
            echo "AWS_ACCESS_KEY_ID=$key"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"
          echo "using the shared cache with the $scope credential"

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: cache statistics
        if: vars.SCCACHE_ENDPOINT != ''
        run: sccache --show-stats || true

  # The reconciler is bash, so it gets the same treatment the Rust gets: a linter
  # that fails the build, and its tests run on every push rather than by hand.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning \
            backends/docker/*.sh \
            backends/docker/test/*.sh \
            hack/*.sh \
            hack/local-test/*.sh

  # The reconciler's own tests. Unlike the quickstart e2e — which needs a kind
  # cluster and public repos, and so runs on a schedule — this needs only the
  # Docker the ubuntu runner already has, which is cheap enough to gate every
  # pull request.
  reconciler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: convergence and failure handling
        run: bash backends/docker/test/run-convergence-test.sh
      - name: deploy, no-op, redeploy
        run: bash backends/docker/test/run-test.sh
      - name: nothing was left running
        if: always()
        run: |
          left="$(docker ps -aq --filter 'name=gitops-' | wc -l)"
          if [ "$left" != "0" ]; then
            echo "::error::the reconciler tests left $left container(s) behind"
            docker ps -a --filter 'name=gitops-'
            exit 1
          fi
          echo "no gitops-* containers left behind"

  # What the Kubernetes renderer emits must be something a real API server would
  # accept. Validated against the published Kubernetes schemas rather than a
  # cluster, so it gates every pull request instead of needing one — and it
  # catches the realistic failure, which is the renderer emitting a wrong type or
  # a field that does not exist.
  rendered-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # The exhaustive fixture AND every shipped example. The fixture exercises
      # every field; real examples combine them in ways it does not, which is how
      # the escape-hatch merge bug was found.
      - name: render everything for both substrates
        run: |
          mkdir -p /tmp/render /tmp/stack
          ./target/release/dabba application example > /tmp/exhaustive.yaml
          for f in /tmp/exhaustive.yaml examples/applications/*.yaml; do
            name="$(basename "$f" .yaml)"
            ./target/release/dabba application validate "$f"
            ./target/release/dabba application render "$f" \
              --substrate kind > "/tmp/render/$name-kubernetes.yaml"
            ./target/release/dabba application render "$f" \
              --substrate docker-host > "/tmp/stack/$name-compose.yml"
          done
      - name: every Kubernetes rendering validates against real schemas
        run: |
          docker run --rm -v /tmp/render:/work ghcr.io/yannh/kubeconform:latest \
            -strict -summary -kubernetes-version 1.31.0 /work
      - name: every compose rendering is something docker compose accepts
        run: |
          for f in /tmp/stack/*-compose.yml; do
            dir="$(mktemp -d)"; cp "$f" "$dir/docker-compose.yml"
            ( cd "$dir" && docker compose config > /dev/null ) \
              || { echo "::error::$f is not a valid compose file"; exit 1; }
          done

  # The pinned environment is only real if something checks it. This checks the
  # half that does not need the toolchain installed: that every Application tag
  # and every hand-written compose stack agrees with spec.environment.services.
  pinned-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: shipped artifacts agree with the pinned service versions
        run: ./target/release/dabba environment verify -c examples/local.yaml

  # Dependency advisories, license policy, banned/duplicate crates, source allow-list.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Secret scanning over the working tree AND full git history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  # Lint the workflow files themselves.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" | tar -xz actionlint
          ./actionlint -color
