# Reference local config — the tier-0 self-contained quickstart, one env per
# local substrate.
#   dabba up                 # the default env (kind)
#   dabba env minikube up    # a specific env
#   dabba ls                 # list envs
apiVersion: dabba.spicelabs.io/v1alpha1
kind: DabbaConfig
metadata:
  name: dabba
spec:
  domain: localtest.me # shared across envs
  tls:
    issuer: selfsigned
  defaultEnvironment: kind
  environments:
    - { name: kind, substrate: kind }
    - { name: k3d, substrate: k3d }
    - { name: minikube, substrate: minikube }
  observability:
    enabled: false # Vector -> OpenObserve (+ OTEL traces); opt-in, off by default
  useCases:
    - demo

  # The pinned environment. One place that decides which versions a laptop, a CI
  # runner and a cloud box all resolve to — the thing that makes "the same thing
  # everywhere" true rather than aspirational.
  #
  #   dabba environment show     the pins, and how this machine compares
  #   dabba environment check    exits non-zero on drift (a pin nobody checks is
  #                              a comment)
  #   dabba environment export   shell exports, for a workflow to eval
  #   dabba environment verify   Application tags that disagree with a service pin
  environment:
    # What must be INSTALLED to build. Nothing deploys these; they are checked.
    toolchain:
      rust: "1.83.0"
      rustTargets:
        - wasm32-wasip2
      tools:
        just: "1.36.0"
        sccache: "0.8.2"

    # Versions of services dabba RUNS. Deliberately not restated in the
    # Application definitions that carry the image tags — that would be two lists
    # drifting apart, which is the bug this codebase keeps producing. This is the
    # authority; `dabba environment verify` reports any definition that disagrees.
    services:
      postgres: "16"
      openbao: "2.1.0"
